name: build

# Every push to main is checked and built for Linux.
# When the commit message starts with a version (V1, V1.2, V1.2.3.4, …), the build is published as that release.
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # always the newest Go release, so builds include its security fixes (go.mod only sets the minimum)
      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Check
        run: |
          go vet ./...
          # the program has to start, create its database and stop at the missing server config
          grep -q "no server configured" <<< "$(go run ./cmd/tasks --sync 2>&1)"

      - name: Build and publish
        env:
          MESSAGE: ${{ github.event.head_commit.message }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # only at the start, so a message like "update setup-go to v5" does not publish a release;
          # V1.2 is tagged v1.2 because Go only reads lowercase version tags
          version="$(head -n 1 <<< "$MESSAGE" | grep -oE '^[vV][0-9]+(\.[0-9]+)*(-[0-9A-Za-z.]+)?' | sed 's/^V/v/' || true)"
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOARCH="$arch" go build -trimpath -ldflags "-s -w -X main.version=${version:-dev}" -o tasks ./cmd/tasks
            tar -czf "tasks-linux-$arch.tar.gz" tasks config.example.toml
          done
          # a message without a version only builds; for a release GitHub creates the tag on the pushed commit
          [ -z "$version" ] || gh release create "$version" tasks-linux-*.tar.gz install.sh --target "$GITHUB_SHA" --title "$version" --generate-notes
