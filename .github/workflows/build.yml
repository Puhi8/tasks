name: build

# Pushing to main tests the app on Linux and macOS and builds it.
# When the pushed commit's message names a version (labtohub "gittohub v1.2.3"), the build is also published as release v1.2.3.
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # always the newest Go release, so builds include its security fixes (go.mod only sets the minimum)
      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Vet
        run: go vet ./...

      # the program has to start and create its database on every system it is released for
      - name: Smoke test
        run: |
          go build -o tasks ./cmd/tasks
          ./tasks --version
          printf '[storage]\ndatabase = "%s/tasks.db"\n' "$RUNNER_TEMP" > "$RUNNER_TEMP/config.toml"
          if ./tasks --config "$RUNNER_TEMP/config.toml" --sync; then
            echo "--sync without a server should fail"
            exit 1
          fi
          test -f "$RUNNER_TEMP/tasks.db"

  build:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Version
        id: version
        env:
          MESSAGE: ${{ github.event.head_commit.message }}
        run: echo "version=$(printf '%s\n' "$MESSAGE" | head -n 1 | grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?' | head -n 1 || true)" >> "$GITHUB_OUTPUT"

      - name: Build
        env:
          VERSION: ${{ steps.version.outputs.version || 'dev' }}
        run: |
          mkdir dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os="${target%/*}"
            arch="${target#*/}"
            mkdir -p "build/$os-$arch"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags "-s -w -X main.version=$VERSION" -o "build/$os-$arch/tasks" ./cmd/tasks
            cp config.example.toml "build/$os-$arch/"
            tar -czf "dist/tasks-$os-$arch.tar.gz" -C "build/$os-$arch" .
          done
          (cd dist && sha256sum *.tar.gz > checksums.txt)
          # the install script attached to the release downloads from this repository
          sed "s|__REPOSITORY__|$GITHUB_REPOSITORY|" install.sh > dist/install.sh

      # GitHub creates the tag for the release on the pushed commit, so nobody has to tag by hand
      - name: Publish
        if: steps.version.outputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: gh release create "$VERSION" dist/* --target "$GITHUB_SHA" --title "$VERSION" --generate-notes
